preload = ~/.config/hypr/od_outrun_wave.png
preload = ~/.config/hypr/geass.png

# Laptop screen
wallpaper {
    monitor = eDP-2
    path = ~/.config/hypr/geass.png
    fit_mode = cover
}

# External monitor
wallpaper {
    monitor = HDMI-A-1
    path = ~/.config/hypr/geass.png
    fit_mode = cover
}

# Fallback (optional)
wallpaper {
    monitor =
    path = ~/.config/hypr/od_wave.png
    fit_mode = cover
}

# Options
splash = false
ipc = off
