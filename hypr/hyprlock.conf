# --- System Info Group (Right side) ---
# Uptime
label {
  monitor =
  text = cmd[update:60000] echo "  $(uptime -p | sed 's/up //')"
  color = rgba(216, 222, 233, 0.9)
  font_size = 13
  font_family = JetBrainsMono Nerd Font Medium
  position = -50, 85
  halign = right
  valign = bottom
}

# Hostname
label {
  monitor =
  text = cmd[update:60000] echo "  $(uname -n)"
  color = rgba(216, 222, 233, 0.9)
  font_size = 13
  font_family = JetBrainsMono Nerd Font Medium
  position = -50, 60
  halign = right
  valign = bottom
}

# Battery (if applicable)
label {
  monitor =
  text = cmd[update:30000] echo " $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'AC')%"
  color = rgba(163, 190, 140, 0.9)
  font_size = 13
  font_family = JetBrainsMono Nerd Font Medium
  position = -50, 35
  halign = right
  valign = bottom
}
