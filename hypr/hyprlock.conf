# === hyprlock.conf | Nord Wave === #
# ================================= #
#
# Fixed version:
# - Moved time/date higher to avoid wallpaper overlap
# - Fixed password field placeholder text issue
# - Moved password field lower on screen
# ================================= #
# === hyprlock.conf | Nord Wave === #
# ================================= #
#
# Enhanced version with:
# - Smooth animations and transitions
# - Better visual hierarchy with shadows
# - Refined spacing and alignment
# - Enhanced password field styling
# - Subtle background blur for depth
#
# --- Nord Theme Colors ---
# Polar Night (Dark)
$nord0 = rgb(46, 52, 64)   # Inner bg
$nord1 = rgb(59, 66, 82)
$nord2 = rgb(67, 76, 94)
$nord3 = rgb(76, 86, 106)   # Outer bg / borders
# Snow Storm (Light)
$nord4 = rgb(216, 222, 233) # Main text
$nord5 = rgb(229, 233, 240)
$nord6 = rgb(236, 239, 244)
# Frost (Accents)
$nord7 = rgb(143, 188, 187)
$nord8 = rgb(136, 192, 208) # Date color
$nord9 = rgb(129, 161, 193)
$nord10 = rgb(94, 129, 172)
# Aurora (Bright Accents)
$nord11 = rgb(191, 97, 106) # Fail
$nord12 = rgb(208, 135, 112)
$nord13 = rgb(235, 203, 139) # Capslock
$nord14 = rgb(163, 190, 140) # Check
$nord15 = rgb(180, 142, 173) # Accent

# --- General Settings ---
general {
  grace = 3
  no_fade_in = false
  disable_loading_bar = true
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = false
}

# --- Background ---
background {
  monitor =
  path = ~/.config/hypr/od_outrun_wave.png
  blur_passes = 2
  blur_size = 3
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.8172
  vibrancy = 0.1696
  vibrancy_darkness = 0.0
}

# --- Time (Enhanced with shadow) ---
label {
  monitor =
  text = cmd[update:1000] date +"%I:%M %p"
  color = $nord4
  font_size = 110
  font_family = JetBrainsMono Nerd Font ExtraBold
  position = 0, 340
  halign = center
  valign = center
  shadow_passes = 3
  shadow_size = 4
  shadow_color = rgba(0, 0, 0, 0.5)
}

# --- Date (Enhanced styling) ---
label {
  monitor =
  text = cmd[update:60000] date +'%A, %-d %B %Y'
  color = $nord8
  font_size = 22
  font_family = JetBrainsMono Nerd Font Medium
  position = 0, 250
  halign = center
  valign = center
  shadow_passes = 2
  shadow_size = 3
  shadow_color = rgba(0, 0, 0, 0.4)
}

# --- Greeting Label (Optional personalization) ---
label {
  monitor =
  text = cmd[update:3600000] echo "Welcome back, $USER"
  color = $nord7
  font_size = 16
  font_family = JetBrainsMono Nerd Font
  position = 0, 190
  halign = center
  valign = center
  shadow_passes = 1
  shadow_size = 2
  shadow_color = rgba(0, 0, 0, 0.3)
}

# --- Password Field (Enhanced) ---
input-field {
  monitor =
  size = 350, 55
  outline_thickness = 3
  dots_size = 0.3
  dots_spacing = 0.25
  dots_center = true
  dots_rounding = -1
  rounding = 12
  outer_color = $nord3
  inner_color = $nord0
  font_color = $nord4
  fade_on_empty = true
  fade_timeout = 1000
  placeholder_text = <span foreground="##88c0d0"><i>  Enter Password</i></span>
  hide_input = false
  check_color = $nord14
  fail_color = $nord11
  fail_text = <span foreground="##bf616a"><i> $FAIL <b>($ATTEMPTS)</b></i></span>
  fail_transition = 300
  capslock_color = $nord13
  numlock_color = -1
  bothlock_color = -1
  invert_numlock = false
  swap_font_color = false
  position = 0, -300
  halign = center
  valign = center
  shadow_passes = 2
  shadow_size = 3
  shadow_color = rgba(0, 0, 0, 0.3)
}

# --- Password Hint Label ---
label {
  monitor =
  text = Press ESC to clear
  color = rgba(216, 222, 233, 0.5)
  font_size = 11
  font_family = JetBrainsMono Nerd Font
  position = 0, -380
  halign = center
  valign = center
}

# --- Lock Indicator (Enhanced) ---
label {
  monitor =
  text = 󰌾 System Locked
  color = $nord13
  font_size = 15
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, 50
  halign = center
  valign = bottom
  shadow_passes = 1
  shadow_size = 2
  shadow_color = rgba(0, 0, 0, 0.4)
}

