# -----------------------------
# Tmux Configuration for Neovim
# -----------------------------

# Set default shell to zsh
set-option -g default-shell /bin/zsh
# Variables
gray_light="#D8DEE9"
set -g allow-passthrough on
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window numbering at 1
set -g base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on
# Reload config
unbind r 
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable mouse support
set -g mouse on

# Status bar configuration
set -g status-position top
set -g status-left-length 100
set -g status-left "#[fg=#A3BE8C,bold] #S#[fg=#D8DEE9,nobold] | "
set -g status-style "bg=default,fg=${gray_light}"
set -g status-bg default
set -g pane-border-style "fg=#3B4252"
set -g pane-active-border-style "fg=#ABB2BF" 
# Proper key handling for terminals
setw -g xterm-keys on

# Extended key support for Ctrl+Shift combinations
set -g extended-keys on
set -g extended-keys-format csi-u

# -----------------------------
# Pane Navigation
# -----------------------------

# Smart pane switching with Neovim
bind -n C-h if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq nvim' \
  'send-keys C-h' \
  'select-pane -L'

bind -n C-j if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq nvim' \
  'send-keys C-j' \
  'select-pane -D'

bind -n C-k if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq nvim' \
  'send-keys C-k' \
  'select-pane -U'

bind -n C-l if-shell 'tmux display-message -p "#{pane_current_command}" | grep -iq nvim' \
  'send-keys C-l' \
  'select-pane -R'


# Split panes like Vim
bind | split-window -h
bind - split-window -v


# -----------------------------
# Pane Resizing
# -----------------------------

bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# -----------------------------
# Quick Window Switching
# -----------------------------

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Close popup
bind-key -n C-q if-shell -F '#{==:#{session_name},popup-term}' 'detach-client' ''

# -----------------------------
# Copy Mode
# -----------------------------

setw -g mode-keys vi
set -s set-clipboard on

bind [ copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugins
# -----------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @catppuccin_status_background "default"

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
